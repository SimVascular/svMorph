name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"   # e.g. v0.1.0, v0.1.1-rc1

permissions:
  contents: write   # needed to create the GitHub Release
  id-token: write   # needed for PyPI trusted publishing (OIDC)

jobs:
  # ------------------------------------------------------------------ #
  # 1. Run the test suite on the tagged commit before publishing        #
  # ------------------------------------------------------------------ #
  test:
    name: Run tests before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # README.md is uploaded as the PyPI project description and cannot be
      # changed once a version is published, so every hand-maintained version
      # string has to match the tag in the tagged commit itself.
      - name: Check that the tag matches all version strings
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          package=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' svmorph/__init__.py)
          badge=$(sed -n 's/.*badge\/version-\([^-]*\)-.*/\1/p' README.md)
          echo "tag=$tag pyproject.toml=$pyproject __version__=$package README badge=$badge"
          if [ "$tag" != "$pyproject" ] || [ "$tag" != "$package" ] || [ "$tag" != "$badge" ]; then
            echo "::error::Version mismatch: bump pyproject.toml, svmorph/__init__.py and the README badge to $tag in the tagged commit."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The "warp" extra is installed so that the optional Warp backend is
      # tested (on Warp's CPU device) before a release is published
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,warp]"
          pytest tests/ -v

  # ------------------------------------------------------------------ #
  # 2. Build the source distribution and wheel                         #
  # ------------------------------------------------------------------ #
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ------------------------------------------------------------------ #
  # 3. Publish to PyPI using OIDC trusted publishing                   #
  #    Configure on PyPI: https://pypi.org/manage/account/publishing/  #
  # ------------------------------------------------------------------ #
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/svmorph
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ------------------------------------------------------------------ #
  # 4. Create a GitHub Release with the built artifacts attached       #
  # ------------------------------------------------------------------ #
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for tag message

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
